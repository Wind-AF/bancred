<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valor do Empréstimo - Bancred</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100dvh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111827; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; background: #FFFFFF; }
    h1, h2, h3, h4, p { margin: 0; }
    button { font-family: inherit; }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 999px; background: #E5E7EB; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #1C68E3; cursor: pointer; box-shadow: 0 2px 8px rgba(28,104,227,0.4); border: 2px solid #FFFFFF; }
    button:hover { filter: brightness(0.93); }
  </style>
</head>
<body>

  <header style="background:#FFFFFF;border-bottom:1px solid #E5E7EB;padding:16px;">
    <div style="max-width:1280px;margin:0 auto;display:flex;justify-content:center;">
      <a href="index.html" style="height:56px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;">
        <svg width="32" height="32" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="38" height="38" rx="10" fill="#EFF6FF"/>
          <path d="M7 28V16l12-7 12 7v12" stroke="#1C68E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="14" y="20" width="10" height="8" rx="1" stroke="#1C68E3" stroke-width="2"/>
          <path d="M10 28h18" stroke="#1C68E3" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span style="font-size:22px;font-weight:800;color:#1C68E3;letter-spacing:-1px;">Bancred</span>
      </a>
    </div>
  </header>

  <main style="flex:1;background:#F9FAFB;">
    <section style="padding:32px 16px;">
      <div style="max-width:448px;margin:0 auto;">

        <div style="margin-bottom:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span style="font-size:12px;font-weight:600;color:#6B7280;">Etapa 7 de 9</span>
            <span style="font-size:12px;font-weight:600;color:#1C68E3;">78%</span>
          </div>
          <div style="background:#E5E7EB;border-radius:999px;height:6px;overflow:hidden;">
            <div style="background:linear-gradient(90deg,#3B82F6,#1C68E3);height:6px;width:78%;border-radius:999px;"></div>
          </div>
        </div>

        <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -2px rgba(0,0,0,0.05);">
          <div style="padding:24px 24px 0;text-align:center;">
            <div style="width:56px;height:56px;background:#EFF6FF;border:2px solid #BFDBFE;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px auto;">
              <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 17 L12 3 L22 17"/><path d="M5 17h14"/></svg>
            </div>
            <div style="font-size:20px;font-weight:700;color:#0F172A;letter-spacing:-0.3px;">Quanto você precisa?</div>
            <p style="color:#64748B;margin-top:6px;font-size:14px;">Selecione o valor desejado</p>
          </div>

          <div style="padding:24px;">
            <!-- Value Display -->
            <div style="text-align:center;margin-bottom:28px;">
              <div style="font-size:13px;font-weight:600;color:#6B7280;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.8px;">Valor selecionado</div>
              <div id="valor-display" style="font-size:40px;font-weight:800;color:#1C68E3;letter-spacing:-1px;font-variant-numeric:tabular-nums;">R$ 5.000</div>
            </div>

            <!-- Slider -->
            <div style="padding:0 4px;margin-bottom:12px;">
              <input type="range" id="slider" min="1000" max="18000" step="500" value="5000" oninput="updateValor(this.value)">
            </div>
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#9CA3AF;font-weight:500;margin-bottom:28px;">
              <span>R$ 1.000</span>
              <span>R$ 18.000</span>
            </div>

            <!-- Quick select buttons -->
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;">
              <button onclick="setValor(2000)" style="padding:8px 4px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;font-size:12px;font-weight:600;color:#6B7280;cursor:pointer;">R$ 2.000</button>
              <button onclick="setValor(5000)" style="padding:8px 4px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;font-size:12px;font-weight:600;color:#6B7280;cursor:pointer;">R$ 5.000</button>
              <button onclick="setValor(10000)" style="padding:8px 4px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;font-size:12px;font-weight:600;color:#6B7280;cursor:pointer;">R$ 10.000</button>
            </div>

            <button onclick="continuar()" style="width:100%;min-height:52px;padding:12px 16px;background:linear-gradient(135deg,#3B82F6 0%,#1C68E3 100%);color:#FFFFFF;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px rgba(28,104,227,0.28);">
              Continuar
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer style="background:#111827;color:#D1D5DB;text-align:center;padding:24px 16px;font-size:12px;line-height:1.7;">
    <div style="color:#9CA3AF;">© 2026 Bancred LTDA. Todos os direitos reservados.</div>
    <div style="color:#6B7280;margin-top:4px;">CNPJ 41.906.644/0001-20</div>
  </footer>

<script>
  function formatBRL(v) {
    return 'R$ ' + parseInt(v).toLocaleString('pt-BR');
  }
  function updateValor(v) {
    document.getElementById('valor-display').textContent = formatBRL(v);
  }
  function setValor(v) {
    document.getElementById('slider').value = v;
    updateValor(v);
  }
  function continuar() {
    var v = document.getElementById('slider').value;
    sessionStorage.setItem('valor', formatBRL(v));
    window.location.href = 'prazo.html';
  }
</script>
</body>
</html>
